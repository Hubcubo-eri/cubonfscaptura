# Override de produção — usa Caddy como reverse proxy TLS na frente.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Diferenças vs docker-compose.yml (dev):
# - backend e frontend NÃO expõem portas no host; apenas o Caddy (80/443).
# - Caddy provisiona TLS via Let's Encrypt automaticamente.
# - Redis fica isolado na rede interna (sem porta no host).
# - Adiciona ENV APP_ENV=production para desabilitar create_all.
services:
  caddy:
    image: caddy:2-alpine
    container_name: cubo_captura_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    ports: []
    environment:
      APP_ENV: production

  frontend:
    ports: []

  redis:
    ports: []

  db:
    ports: []

volumes:
  caddy_data:
  caddy_config:
